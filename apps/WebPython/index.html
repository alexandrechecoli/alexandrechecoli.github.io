<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebPython — Pesquisa Operacional</title>

  <!-- CodeMirror 5 (mesma versão e temas do WebHIGHS) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/nord.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css">
  <!-- Addons do CodeMirror: busca, dobra de código e autocompletar -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
  <link rel="stylesheet" href="style.css?v=8">
</head>

<body>
  <!-- ── Toolbar ──────────────────────────────────────────────────────── -->
  <div class="toolbar">
    <span class="brand">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg>
      WebPython
    </span>
    <div class="sep"></div>

    <select class="btn" id="examples-select" title="Carregar código de exemplo">
      <option value="">Exemplos…</option>
    </select>

    <div class="sep"></div>
    <button class="btn" id="btn-open" title="Abrir arquivos: .py (código) ou .csv, .txt, .json… (dados)">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Abrir
    </button>
    <button class="btn" id="btn-save" title="Salvar a aba atual em arquivo (Ctrl+S)">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 3v5h7V3M7 21v-7h10v7"/></svg>
      Salvar
    </button>
    <input type="file" id="file-input" accept=".py,.csv,.tsv,.txt,.json,.dat" multiple style="display:none">

    <div class="toolbar-right">
      <label class="theme-switch" id="theme-switch-label" title="Alternar tema claro/escuro">
        <input type="checkbox" id="btn-theme" class="theme-switch-input">
        <span class="theme-switch-track"><span class="theme-switch-thumb"></span></span>
      </label>
      <div class="sep"></div>
      <!-- Preferências do editor (tema de cores e tamanho da fonte) -->
      <div class="settings">
        <button class="icon-btn" id="btn-settings" title="Preferências do editor" aria-haspopup="true" aria-expanded="false">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        </button>
        <div class="popover" id="settings-menu" hidden>
          <div class="popover-row">
            <label for="editor-theme-select">Tema do editor</label>
            <select class="editor-theme-select" id="editor-theme-select">
              <option value="dracula">Dracula</option>
              <option value="monokai">Monokai</option>
              <option value="material-darker">Material Darker</option>
              <option value="nord">Nord</option>
              <option value="eclipse">Eclipse</option>
              <option value="default">Claro (padrão)</option>
            </select>
          </div>
          <div class="popover-row">
            <span>Fonte do editor</span>
            <div class="font-btns">
              <button class="font-btn" id="font-dec" title="Diminuir fonte (Ctrl+-)">A−</button>
              <span id="font-size-display">14px</span>
              <button class="font-btn" id="font-inc" title="Aumentar fonte (Ctrl++)">A+</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="main" id="main">

    <!-- Editor -->
    <div class="panel-editor" id="panel-editor">
      <div class="tab-row">
        <div class="tab-bar" id="tab-bar"></div>
        <!-- Executar / Parar: só um dos dois aparece por vez -->
        <div class="editor-actions">
          <button class="icon-btn run" id="btn-run" title="Executar (F5 ou Ctrl+Enter)" aria-label="Executar" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
          </button>
          <button class="icon-btn stop" id="btn-stop" title="Interromper a execução (Shift+F5)" aria-label="Parar" hidden>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
          </button>
        </div>
      </div>
      <div class="cm-wrapper" id="cm-wrapper"></div>
      <div class="resize-handle" id="resize-handle"></div>
    </div>

    <!-- Saída e Ajuda: duas visões do mesmo painel, trocadas pelas abas do cabeçalho -->
    <div class="panel-results">
      <div class="panel-header">
        <div class="panel-tabs" role="tablist">
          <button class="panel-tab active" id="panel-tab-output" data-view="output" role="tab" aria-selected="true">Saída</button>
          <button class="panel-tab" id="panel-tab-help" data-view="help" role="tab" aria-selected="false" title="Documentação e exemplos comentados (F1)">Ajuda</button>
        </div>
        <div class="font-btns">
          <button class="font-btn" id="result-font-dec" title="Diminuir tamanho do texto">A−</button>
          <span id="result-font-size-display">100%</span>
          <button class="font-btn" id="result-font-inc" title="Aumentar tamanho do texto">A+</button>
        </div>
        <button class="icon-btn small" id="btn-clear" title="Limpar a saída" aria-label="Limpar a saída">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M6.5 6.5l11 11"/></svg>
        </button>
      </div>
      <div class="results-body" id="results">
        <div class="view" id="view-output">
        <div class="placeholder" id="placeholder">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M7 9l3 3-3 3M13 15h4"/>
          </svg>
          <div>Escreva ou carregue um código, depois clique em
          <svg class="icon inline-run" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
          <strong>Executar</strong><br>
          <span class="kbd-hint">ou pressione <kbd>F5</kbd> ou <kbd>Ctrl</kbd>+<kbd>Enter</kbd></span></div>
          <div style="font-size:11px">Solver: <strong style="color:var(--accent)">HiGHS</strong> (highspy) via WebAssembly · Suporta PL e PLI</div>
        </div>
        <div class="log-pane" id="output" aria-live="polite" hidden></div>
        </div>

        <div class="view" id="view-help" hidden>
          <div class="help-bar">
            <button class="icon-btn small" id="help-back" title="Voltar" aria-label="Voltar" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <button class="icon-btn small" id="help-forward" title="Avançar" aria-label="Avançar" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
            </button>
            <button class="icon-btn small" id="help-home" title="Índice da ajuda" aria-label="Índice da ajuda">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/></svg>
            </button>
            <input type="search" class="help-search" id="help-search" placeholder="Buscar na ajuda…" aria-label="Buscar na ajuda">
          </div>
          <div class="help-content" id="help-content"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Status bar ────────────────────────────────────────────────────── -->
  <div class="statusbar">
    <span class="dot loading" id="dot"></span>
    <span id="status-msg">Carregando Python…</span>
    <span class="statusbar-right">
      <span id="status-cursor" title="Posição do cursor">Ln 1, Col 1</span>
      <span id="status-indent" title="Indentação da tecla Tab">Espaços: 4</span>
      <span id="status-lang" title="Tipo da aba ativa">Python</span>
      <span id="status-engine-badge">Pyodide · WebAssembly</span>
      <span class="kbd-hint"><kbd>F5</kbd> executa · <kbd>F1</kbd> ajuda</span>
    </span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/indent-fold.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <!-- Ajuda: destaque dos blocos de código (runmode) e conversão de Markdown (marked) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script type="module" src="app.js?v=8"></script>
</body>
</html>
